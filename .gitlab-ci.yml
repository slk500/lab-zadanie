stages:
  - test
  - build
  - push

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  REGISTRY_IMAGE: $CI_REGISTRY_IMAGE

# ─── Backend Tests ────────────────────────────────────────────────────────────
backend:test:
  stage: test
  image: php:8.4-cli
  services:
    - name: mysql:8.0
      alias: mysql
      variables:
        MYSQL_ROOT_PASSWORD: rootsecret
        MYSQL_DATABASE: testing
        MYSQL_USER: root
        MYSQL_PASSWORD: secret
  before_script:
    - apt-get update -qq && apt-get install -y -qq default-mysql-client unzip git zip libzip-dev libonig-dev
    - docker-php-ext-install pdo pdo_mysql mbstring bcmath zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - cd backend
    - composer install --no-interaction --prefer-dist
    - cp .env.example .env || true
    - |
      cat > .env <<EOF
      APP_NAME=Laravel
      APP_ENV=testing
      APP_KEY=
      APP_DEBUG=true
      APP_URL=http://localhost
      DB_CONNECTION=mysql
      DB_HOST=mysql
      DB_PORT=3306
      DB_DATABASE=testing
      DB_USERNAME=root
      DB_PASSWORD=secret
      JWT_SECRET=test-secret-key-for-ci-only-not-production
      CACHE_STORE=array
      SESSION_DRIVER=array
      QUEUE_CONNECTION=sync
      EOF
    - php artisan key:generate
  script:
    - php artisan migrate --force
    - php artisan test --no-interaction
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  artifacts:
    reports:
      junit: backend/storage/test-results.xml
    when: always

# ─── Frontend Build ───────────────────────────────────────────────────────────
frontend:build:
  stage: build
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day

# ─── Docker Images ────────────────────────────────────────────────────────────
docker:backend:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" -t "$REGISTRY_IMAGE/backend:latest" ./backend
    - docker push "$REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
    - docker push "$REGISTRY_IMAGE/backend:latest"

docker:frontend:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA" -t "$REGISTRY_IMAGE/frontend:latest" ./frontend
    - docker push "$REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
    - docker push "$REGISTRY_IMAGE/frontend:latest"
